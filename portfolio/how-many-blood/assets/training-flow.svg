<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system, BlinkMacSystemFont, Pretendard, Inter, sans-serif">
  <rect width="880" height="360" fill="#0b0d10"/>
  <text x="20" y="28" fill="#e6e8eb" font-size="15" font-weight="600">학습 흐름 — Firebase Functions 주 1회 재학습</text>
  <text x="20" y="48" fill="#a4adb8" font-size="11">predictionScheduler.ts → predictionModel.ts → Firestore `predictionModels/{id}`</text>

  <!-- step boxes -->
  <g font-size="11">
    <rect x="20" y="80" width="160" height="100" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="100" y="104" fill="#7c5cff" font-size="12" font-weight="700" text-anchor="middle">① 데이터 수집</text>
    <text x="100" y="126" fill="#e6e8eb" text-anchor="middle">Firestore 조회</text>
    <line x1="40" y1="140" x2="160" y2="140" stroke="#252c34"/>
    <text x="100" y="156" fill="#a4adb8" text-anchor="middle">hourly_blood_records</text>
    <text x="100" y="170" fill="#a4adb8" text-anchor="middle">+ dailyWeatherSummary</text>

    <rect x="200" y="80" width="160" height="100" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="280" y="104" fill="#7c5cff" font-size="12" font-weight="700" text-anchor="middle">② 피처 구성</text>
    <line x1="220" y1="120" x2="340" y2="120" stroke="#252c34"/>
    <text x="280" y="138" fill="#a4adb8" text-anchor="middle">temperature</text>
    <text x="280" y="152" fill="#a4adb8" text-anchor="middle">precipitation, snowfall</text>
    <text x="280" y="166" fill="#a4adb8" text-anchor="middle">dayOfWeek (0~6)</text>

    <rect x="380" y="80" width="160" height="100" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="460" y="104" fill="#7c5cff" font-size="12" font-weight="700" text-anchor="middle">③ 변수별 OLS</text>
    <line x1="400" y1="120" x2="540" y2="120" stroke="#252c34"/>
    <text x="460" y="138" fill="#a4adb8" text-anchor="middle">β = (n·ΣXY − ΣX·ΣY)</text>
    <text x="460" y="152" fill="#a4adb8" text-anchor="middle">       / (n·ΣX² − (ΣX)²)</text>
    <text x="460" y="166" fill="#a4adb8" text-anchor="middle">각 피처별 단변량 회귀</text>

    <rect x="560" y="80" width="160" height="100" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="640" y="104" fill="#7c5cff" font-size="12" font-weight="700" text-anchor="middle">④ 계수 합성</text>
    <line x1="580" y1="120" x2="700" y2="120" stroke="#252c34"/>
    <text x="640" y="138" fill="#a4adb8" text-anchor="middle">intercept = 전체 평균</text>
    <text x="640" y="152" fill="#a4adb8" text-anchor="middle">dayOfWeek[i] = 요일 평균 − 전체</text>
    <text x="640" y="166" fill="#a4adb8" text-anchor="middle">→ LinearModelCoefficients</text>

    <rect x="740" y="80" width="120" height="100" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="800" y="104" fill="#d62828" font-size="12" font-weight="700" text-anchor="middle">⑤ 메트릭</text>
    <line x1="760" y1="120" x2="840" y2="120" stroke="#252c34"/>
    <text x="800" y="138" fill="#a4adb8" text-anchor="middle">R² = 1 − SS_res/SS_tot</text>
    <text x="800" y="152" fill="#a4adb8" text-anchor="middle">MAE, RMSE</text>
    <text x="800" y="166" fill="#a4adb8" text-anchor="middle">featureImportance</text>

    <!-- arrows -->
    <g stroke="#d62828" stroke-width="1.4" fill="none">
      <path d="M180 130 L200 130" marker-end="url(#arr)"/>
      <path d="M360 130 L380 130" marker-end="url(#arr)"/>
      <path d="M540 130 L560 130" marker-end="url(#arr)"/>
      <path d="M720 130 L740 130" marker-end="url(#arr)"/>
    </g>

    <!-- bottom row: predict -->
    <rect x="280" y="220" width="320" height="110" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="440" y="244" fill="#e6e8eb" font-size="13" font-weight="700" text-anchor="middle">⑥ 예측 (predictDonation)</text>
    <text x="440" y="266" fill="#a4adb8" font-size="11" text-anchor="middle">predicted = intercept + β₁·T + β₂·P + β�·S + dayOfWeek[dow]</text>
    <text x="440" y="284" fill="#a4adb8" font-size="11" text-anchor="middle">confidence = max(0, min(1, R²))</text>
    <text x="440" y="302" fill="#a4adb8" font-size="11" text-anchor="middle">predictedCount = round(max(0, predicted))</text>
    <text x="440" y="320" fill="#d62828" font-size="10" text-anchor="middle">→ Firestore `dailyDonationPredictions`에 저장</text>

    <path d="M460 180 L460 220" stroke="#d62828" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d62828"/>
    </marker>
  </defs>
</svg>
