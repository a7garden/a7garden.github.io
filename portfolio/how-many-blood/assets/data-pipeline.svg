<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="-apple-system, BlinkMacSystemFont, Pretendard, Inter, sans-serif">
  <rect width="900" height="280" fill="#0b0d10"/>
  <text x="20" y="26" fill="#e6e8eb" font-size="14" font-weight="600">데이터 파이프라인 — 혈액정보 시스템 → 예측 모델</text>

  <g font-size="11">
    <rect x="20" y="60" width="160" height="140" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="100" y="84" fill="#d62828" font-size="12" font-weight="700" text-anchor="middle">① 데이터 소스</text>
    <text x="100" y="106" fill="#e6e8eb" text-anchor="middle">혈액정보 시스템</text>
    <text x="100" y="122" fill="#a4adb8" font-size="10" text-anchor="middle">biss.bloodinfo.net</text>
    <line x1="40" y1="138" x2="160" y2="138" stroke="#252c34"/>
    <text x="100" y="156" fill="#a4adb8" text-anchor="middle">10~20시 매시간</text>
    <text x="100" y="172" fill="#a4adb8" text-anchor="middle">17개 시도 × 11시간</text>
    <text x="100" y="188" fill="#a4adb8" text-anchor="middle">개인/단체 분리</text>

    <rect x="210" y="60" width="160" height="140" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="290" y="84" fill="#d62828" font-size="12" font-weight="700" text-anchor="middle">② 스크래퍼</text>
    <text x="290" y="106" fill="#e6e8eb" text-anchor="middle">Firebase Functions</text>
    <text x="290" y="122" fill="#a4adb8" font-size="10" text-anchor="middle">functions/scraper.ts</text>
    <line x1="230" y1="138" x2="350" y2="138" stroke="#252c34"/>
    <text x="290" y="156" fill="#a4adb8" text-anchor="middle">CORS 프록시 +</text>
    <text x="290" y="172" fill="#a4adb8" text-anchor="middle">HTML 파싱 → JSON</text>
    <text x="290" y="188" fill="#a4adb8" text-anchor="middle">Cloud Scheduler</text>

    <rect x="400" y="60" width="160" height="140" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="480" y="84" fill="#d62828" font-size="12" font-weight="700" text-anchor="middle">③ Firestore</text>
    <text x="480" y="106" fill="#e6e8eb" text-anchor="middle">hourly_blood_records</text>
    <text x="480" y="122" fill="#a4adb8" font-size="10" text-anchor="middle">date_hour 복합키</text>
    <line x1="420" y1="138" x2="540" y2="138" stroke="#252c34"/>
    <text x="480" y="156" fill="#a4adb8" text-anchor="middle">20시 데이터 =</text>
    <text x="480" y="172" fill="#a4adb8" text-anchor="middle">일일 총량</text>
    <text x="480" y="188" fill="#a4adb8" text-anchor="middle">자동 백업</text>

    <rect x="590" y="60" width="160" height="140" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="670" y="84" fill="#7c5cff" font-size="12" font-weight="700" text-anchor="middle">④ ML 학습</text>
    <text x="670" y="106" fill="#e6e8eb" text-anchor="middle">선형회귀 모델</text>
    <text x="670" y="122" fill="#a4adb8" font-size="10" text-anchor="middle">predictionModel.ts</text>
    <line x1="610" y1="138" x2="730" y2="138" stroke="#252c34"/>
    <text x="670" y="156" fill="#a4adb8" text-anchor="middle">기상청 ASOS +</text>
    <text x="670" y="172" fill="#a4adb8" text-anchor="middle">중기예보 (D+3~10)</text>
    <text x="670" y="188" fill="#a4adb8" text-anchor="middle">주 1회 재학습</text>

    <rect x="780" y="60" width="100" height="140" rx="10" fill="#14181d" stroke="#252c34"/>
    <text x="830" y="84" fill="#d62828" font-size="12" font-weight="700" text-anchor="middle">⑤ 시각화</text>
    <text x="830" y="106" fill="#e6e8eb" text-anchor="middle">React</text>
    <text x="830" y="122" fill="#a4adb8" font-size="10" text-anchor="middle">React Query</text>
    <line x1="800" y1="138" x2="860" y2="138" stroke="#252c34"/>
    <text x="830" y="156" fill="#a4adb8" text-anchor="middle">차트</text>
    <text x="830" y="172" fill="#a4adb8" text-anchor="middle">테이블</text>
    <text x="830" y="188" fill="#a4adb8" text-anchor="middle">예측 오버레이</text>

    <g stroke="#d62828" stroke-width="1.5" fill="none">
      <path d="M180 130 L210 130" marker-end="url(#arr)"/>
      <path d="M370 130 L400 130" marker-end="url(#arr)"/>
      <path d="M560 130 L590 130" marker-end="url(#arr)"/>
      <path d="M750 130 L780 130" marker-end="url(#arr)"/>
    </g>
    <defs>
      <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 z" fill="#d62828"/>
      </marker>
    </defs>
  </g>

  <g font-size="11">
    <rect x="490" y="220" width="160" height="44" rx="6" fill="#14181d" stroke="#252c34"/>
    <text x="570" y="244" fill="#e6e8eb" text-anchor="middle">기상청 API (수원/이천)</text>
    <text x="570" y="258" fill="#a4adb8" font-size="10" text-anchor="middle">중기예보 + ASOS 관측</text>
    <path d="M570 220 L670 200" stroke="#7c5cff" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrP)"/>
  </g>
  <defs>
    <marker id="arrP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7c5cff"/>
    </marker>
  </defs>
</svg>
