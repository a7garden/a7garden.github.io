<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="-apple-system, BlinkMacSystemFont, Pretendard, Inter, sans-serif">
  <rect width="720" height="200" fill="#0b0d10"/>
  <text x="20" y="28" fill="#e6e8eb" font-size="14" font-weight="600">헌혈 인원 예측 공식 — RED Toolkit</text>
  <text x="20" y="48" fill="#a4adb8" font-size="11">데이터 300건 이상 시 Ridge 회귀로 가중치 자동 튜닝 · α = 0.1</text>

  <g transform="translate(40,90)" font-size="22" fill="#e6e8eb" font-style="italic">
    <text x="0" y="0">�</text>
    <text x="22" y="0" font-size="20" fill="#a4adb8">=</text>
    <text x="44" y="0" fill="#d62828" font-weight="700">Base</text>
    <text x="105" y="0" fill="#a4adb8">×</text>
    <text x="128" y="0" fill="#7c5cff" font-weight="700">S<tspan font-size="14" baseline-shift="-3">seasonal</tspan></text>
    <text x="232" y="0" fill="#a4adb8">×</text>
    <text x="252" y="0" fill="#7c5cff" font-weight="700">S<tspan font-size="14" baseline-shift="-3">dow</tspan></text>
    <text x="328" y="0" fill="#a4adb8">×</text>
    <text x="348" y="0" fill="#7c5cff" font-weight="700">S<tspan font-size="14" baseline-shift="-3">cycle</tspan></text>
    <text x="438" y="0" fill="#a4adb8">×</text>
    <text x="458" y="0" fill="#7c5cff" font-weight="700">S<tspan font-size="14" baseline-shift="-3">global</tspan></text>
    <text x="558" y="0" fill="#a4adb8">×</text>
    <text x="578" y="0" fill="#7c5cff" font-weight="700">S<tspan font-size="14" baseline-shift="-3">local</tspan></text>
  </g>

  <g transform="translate(40,140)" font-size="11">
    <text x="0" y="0" fill="#d62828">Base</text>
    <text x="6" y="14" fill="#a4adb8">단체 회당 평균</text>
    <text x="80" y="0" fill="#7c5cff">S_seasonal</text>
    <text x="80" y="14" fill="#a4adb8">월별 계절성</text>
    <text x="180" y="0" fill="#7c5cff">S_dow</text>
    <text x="180" y="14" fill="#a4adb8">요일 패턴</text>
    <text x="270" y="0" fill="#7c5cff">S_cycle</text>
    <text x="270" y="14" fill="#a4adb8">주기 시그모이드</text>
    <text x="370" y="0" fill="#7c5cff">S_global</text>
    <text x="370" y="14" fill="#a4adb8">최근 3개월 추세</text>
    <text x="480" y="0" fill="#7c5cff">S_local</text>
    <text x="480" y="14" fill="#a4adb8">단체 자체 추세</text>
  </g>

  <g transform="translate(40,180)" font-size="11">
    <text x="0" y="0" fill="#6c7682">Ridge 가중치 학습: w* = (XᵀX + αI)⁻¹ Xᵀy</text>
    <text x="380" y="0" fill="#6c7682">α = 0.1 · 로그 선형 모델</text>
  </g>
</svg>
