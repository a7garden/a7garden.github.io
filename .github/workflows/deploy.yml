name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: configure
        uses: actions/configure-pages@v5
      - name: Strip repo metadata from artifact
        run: rm -rf .git .github
        shell: bash
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # 68MB static site (posters/covers/portfolio) can take ~12m to
          # publish; the default 600000ms (10m) cuts it off mid-deploy.
          timeout: 1800000
